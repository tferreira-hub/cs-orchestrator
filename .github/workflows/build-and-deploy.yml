name: build-and-deploy

# Builds the CS Platform image, pushes it to the DevOps ECR (880082283556), then
# deploys it by registering a new ECS task-definition revision with the new image
# and updating the service. Mirrors ja-observe-api's deploy.yml. Terraform owns the
# task definition's shape (env, secrets, roles) via ignore_changes=[task_definition];
# this pipeline owns the running IMAGE. Auth via GitHub OIDC (no long-lived keys).

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "plugins/**"
      - "Dockerfile"
      - "requirements-runtime.txt"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_ACCOUNT: "880082283556" # DevOps account
  IMAGE_NAME: cs-platform
  CLUSTER: ja-observe-devops
  SERVICE: ja-observe-devops-cs-platform

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          role-to-assume: ${{ secrets.ECR_PUSH_ROLE_ARN_DEVOPS }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2

      - name: Build and push image
        env:
          REGISTRY: ${{ env.ECR_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          TAG="${GITHUB_SHA::12}"
          docker build -t "${REGISTRY}/${IMAGE_NAME}:${TAG}" .
          docker push "${REGISTRY}/${IMAGE_NAME}:${TAG}"
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME}:${TAG}" >> "$GITHUB_ENV"

      - name: Deploy to ECS (register task def + update service)
        run: |
          # Terraform owns the task-def shape; the pipeline swaps only the image on
          # the CURRENT task definition and registers a new revision.
          TASK_DEF=$(aws ecs describe-services --cluster "$CLUSTER" \
            --services "$SERVICE" --query 'services[0].taskDefinition' --output text)

          aws ecs describe-task-definition --task-definition "$TASK_DEF" \
            --query 'taskDefinition' | \
            jq --arg IMG "$IMAGE" '.containerDefinitions[0].image = $IMG' | \
            jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            > /tmp/new-task-def.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/new-task-def.json \
            --tags key=Environment,value=devops key=Application,value=cs-platform key=ManagedBy,value=github-actions \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_ARN" --propagate-tags SERVICE >/dev/null

          echo "Deployed $NEW_ARN" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the service to stabilise
        run: |
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Service stable." >> "$GITHUB_STEP_SUMMARY"
