name: infra

# Provisions / updates the CS Platform infrastructure in the Tooling account
# (350067031910) by running Terraform against infra/. This is the pipeline that owns
# the infra SHAPE (Cognito, ALB, ECS cluster/service/task, IAM, SSM slots, ECR, and
# the app-deploy OIDC role). The separate build-and-deploy.yml owns the running IMAGE.
#
# Auth via GitHub OIDC (no long-lived keys). The role assumed here is an
# infra-provisioning role (TF_DEPLOY_ROLE_ARN_TOOLING) created once as a bootstrap
# (see infra/RUNBOOK.md); thereafter Terraform manages everything, including the
# narrow app-deploy role used by build-and-deploy.yml.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      apply:
        description: "Set to 'true' to apply (otherwise plan-only)"
        required: false
        default: "false"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  TF_IN_AUTOMATION: "true"
  WORKDIR: infra

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          role-to-assume: ${{ secrets.TF_DEPLOY_ROLE_ARN_TOOLING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          # Disable the wrapper: it can report exit code 1 even on a clean plan when
          # Terraform writes warnings to stderr. We want the real terraform exit code.
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          # -detailed-exitcode: 0 = no changes, 2 = changes present, 1 = error.
          if [ "$code" -eq 1 ]; then exit 1; fi

      # Apply on push to main, or manual dispatch with apply=true. PRs are plan-only.
      - name: Terraform apply
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true')
        run: terraform apply -input=false -no-color tfplan

      - name: Output summary
        if: always()
        run: terraform output -no-color 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
