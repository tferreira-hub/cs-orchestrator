name: build-and-push

# Builds the CS Platform container image and pushes it to the DevOps ECR
# (962430324941) on every push to main, tagged with the immutable git SHA.
# Authenticates via GitHub OIDC (no long-lived keys). The ECR repo `cs-platform`
# is created by ja-observe-api devops Terraform (storage.tf).

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "plugins/**"
      - "Dockerfile"
      - "requirements-runtime.txt"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_ACCOUNT: "962430324941" # DevOps account
  IMAGE_NAME: cs-platform

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          role-to-assume: ${{ secrets.ECR_PUSH_ROLE_ARN_DEVOPS }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2

      - name: Build and push image
        env:
          REGISTRY: ${{ env.ECR_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          TAG="${GITHUB_SHA::12}"
          docker build -t "${REGISTRY}/${IMAGE_NAME}:${TAG}" .
          docker push "${REGISTRY}/${IMAGE_NAME}:${TAG}"
          echo "Pushed ${REGISTRY}/${IMAGE_NAME}:${TAG}"
          echo "image=${REGISTRY}/${IMAGE_NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
